org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Workaround for "Could not close incremental caches in ...cacheable\caches-jvm"
# (java.lang.AssertionError from org.jetbrains.kotlin.compilerRunner.btapi) that
# failed compileDebugKotlin identically across 4 unrelated plugins on the first
# real build attempt - a known class of Kotlin Build-Tools-API incremental-cache
# bug on Windows (JDK 25 is very new; this Kotlin/AGP combination likely hasn't
# been validated against it yet). Disabling incremental compilation removes the
# cache the bug trips over, at the cost of slower rebuilds.
kotlin.incremental=false
